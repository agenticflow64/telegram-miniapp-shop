server:
  port: 8080

s3:
  accessKeyId: ${S3_ACCESS_KEY}
  secretAccessKey: ${S3_SECRET_KEY}
  minioUrl: ${S3_ENDPOINT:}
  region: ${S3_REGION:ru-1}
  bucket: ${S3_BUCKET:goods-bucket}
logging:
  level:
    org.springdoc: DEBUG
    org.springframework: WARN
    ru.webshop: DEBUG
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  cache:
    disabled: true

app:
  admin:
    login: ${APP_ADMIN_LOGIN:admin}
    password: ${APP_ADMIN_PASSWORD:admin}
  seed:
    images-dir: ${SEED_IMAGES_DIR:}

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  session:
    cookie:
      same-site: none
      secure: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  application:
    name: backend
  public-urls:
    - '/api/products/**'
    - '/v3/api-docs.yaml'
    - '/v3/api-docs/**'
    - '/swagger-ui/**'
    - '/swagger-ui.html'
    - '/api/auth/**'
    - '/api/password/**'
    - '/api/token/**'
    - '/api/activate-account'
    - '/swagger-resources/**'
    - '/webjars/**'
    - '/v2/api-docs'
    - '/v2/api-docs/**'
    - '/webjars/swagger-ui/**'
    - '/swagger-ui/index.html'
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goods_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 360000
      refresh-expiration: 604800
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:elastic}
    jackson:
      deserialization:
        FAIL_ON_UNKNOWN_PROPERTIES: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
